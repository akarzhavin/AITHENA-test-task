[tool.poetry]
name = "analyzer"
version = "0.1.0"
description = "Code analysis pipeline — license detection, function extraction, and Rust rewriting via LLM"
authors = ["Aliaksandr Karzhavin"]
readme = "README.md"
packages = [{include = "analyzer", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
pydantic = ">=2.0,<3"
pydantic-settings = ">=2.0,<3"
openai = ">=1.40.0"
tenacity = ">=8.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=0.24"
ruff = ">=0.3.0"
mypy = ">=1.9.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: tests that call real LLM APIs (expensive, slow)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]
exclude = [".venv", ".cache", ".mypy_cache", ".pytest_cache", ".ruff_cache", "data", "tests/fixtures/acceptance/data"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4"]
ignore = []

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
packages = ["analyzer"]
mypy_path = "src"
exclude = ["data", "tests/fixtures/acceptance/data"]
explicit_package_bases = true
check_untyped_defs = true
disallow_untyped_defs = false
